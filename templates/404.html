<!-- templates/404.html -->
{% extends 'base.html' %}

{% block title %}
  404 - Page Not Found
{% endblock %}

{% block content %}
  <div class="container text-center py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 my-5">
        <h1 class="display-1 fw-bold text-primary">404</h1>
        <h2 class="mb-3">Oops! Page Not Found</h2>
        <p class="lead text-muted mb-4">The page you are looking for might have been removed, had its name changed, or belongs to another user.</p>
        <a href="{% url 'home' %}" class="btn btn-primary btn-lg">Go Back Home</a>
      </div>
    </div>
  </div>
{% endblock %}
