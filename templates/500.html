<!-- templates/500.html -->
{% extends 'base.html' %}

{% block title %}
  500 - Server Error
{% endblock %}

{% block content %}
  <div class="container text-center py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 my-5">
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h2 class="mb-3">Internal Server Error</h2>
        <p class="lead text-muted mb-4">Something went wrong on our end. We're looking into it! Please try again later.</p>
        <a href="/" class="btn btn-primary btn-lg">Go Back Home</a>
      </div>
    </div>
  </div>
{% endblock %}
