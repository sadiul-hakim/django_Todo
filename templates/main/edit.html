<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="row">
        <div class="col-md-10 col-12 mx-auto">
          <div class="card p-3">
            <div class="d-flex justify-content-end align-items-center">
                <a href="{% url 'home' %}" class="btn btn-info">Back</a>
            </div>
            <h1 class="text-primary my-2">Edit Todo</h1>

            <form action="{% url 'edit' todo.id %}" method="post">
              {% csrf_token %}
              <div class="form-group">
                <label for="title">Title</label>
                <input type="text" name="title" id="title" class="form-control" value="{{ todo.title }}" />
              </div><br />
              <div class="form-group">
                <label for="priority">Priority</label>
                <input type="number" name="priority" id="priority" class="form-control" value="{{ todo.priority }}" />
              </div><br />
              <div class="form-group">
                <label for="description">Description</label>
                <textarea name="description" id="description" class="form-control">{{ todo.description }}</textarea>
              </div><br />
              <div class="form-group">
                <input type="checkbox" name="completed" id="completed" value="true"
                    {% if todo.completed %}checked{% endif %} />
                <label for="completed">completed</label>
              </div><br />
              <button class="btn btn-primary" type="submit">Edit</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
