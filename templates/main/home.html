<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="row">
        <div class="col-md-10 col-12 mx-auto">
          <div class="mb-3 d-flex justify-content-between align-items-end gap-2">
            <form class="d-flex flex-grow-1 gap-2" action="{% url 'search' %}">
              <input type="search" name="text" id="text" class="form-control flex-grow-1" placeholder="Search...." />
              <input type="submit" value="Search" class="btn btn-success" />
            </form>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addEditorModal">Add</button>
          </div>
          <div class="card">
            <ul class="list-group list-group-flush">
              {% for todo in todos %}
                <li class="list-group-item">
                  <div class="d-flex flex-column justify-content-between align-items-start">
                    <div>
                      <p class="lead">
                        {% if todo.completed %}
                          <span class="text-decoration-line-through">{{ todo.title }}</span>
                        {% else %}
                          {{ todo.title }}
                        {% endif %}
                      </p>
                      <p class="text-muted">{{ todo.description }}</p>
                    </div>
                    <div>
                      <a class="btn btn-warning" href="/edit/{{ todo.id }}">Edit</a>
                      <a class="btn btn-danger" href="/delete/{{ todo.id }}">Delete</a>
                    </div>
                  </div>
                </li>
              {% endfor %}
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="addEditorModal" tabindex="-1" aria-labelledby="addEditorModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="addEditorModalLabel">Modal title</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form action="/" method="post">
              {% csrf_token %}
              <div class="form-group">
                <label for="title">Title</label>
                <input type="text" name="title" id="title" class="form-control" />
              </div><br />
              <div class="form-group">
                <label for="priority">Priority</label>
                <input type="number" name="priority" id="priority" class="form-control" />
              </div><br />
              <div class="form-group">
                <label for="description">Description</label>
                <textarea name="description" id="description" class="form-control"></textarea>
              </div><br />
              <button class="btn btn-primary" type="submit">Add</button>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
