<!-- templates/403.html -->
{% extends 'base.html' %}

{% block title %}
  403 - Permission Denied
{% endblock %}

{% block content %}
  <div class="container text-center py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 my-5">
        <h1 class="display-1 fw-bold text-warning">403</h1>
        <h2 class="mb-3">Access Denied</h2>
        <p class="lead text-muted mb-4">Sorry, you do not have permission to view or modify this resource.</p>
        <a href="{% url 'home' %}" class="btn btn-primary btn-lg">Go Back Home</a>
      </div>
    </div>
  </div>
{% endblock %}
